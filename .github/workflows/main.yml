name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build APK
        run: dotnet publish -f net10.0-android36.1 -c Debug -p:AndroidPackageFormats=apk -p:AndroidSdkDirectory=${{ env.ANDROID_SDK_ROOT }} -p:DebugType=PdbOnly -p:EmbedAssembliesIntoApk=true -p:IsAndroid=true -p:NoDemo=false GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxybudsclient-apk
          path: GalaxyBudsClient.Android/bin/Debug/net10.0-android36.1/publish/me.timschneeberger.galaxybudsclient.demo-Signed.apk
